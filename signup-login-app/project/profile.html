<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Academix</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0ea5e9 0%, #10b981 100%);
            color: #fff;
            min-height: 100vh;
        }

        nav {
            background: rgba(255, 255, 255, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .nav-btn.active {
            background: #0891b2;
            border-color: #0891b2;
        }

        #logoutBtn {
            background: #ff6b6b;
            border: none;
            color: white;
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        #logoutBtn:hover {
            background: #ee5a52;
            transform: scale(1.05);
        }

        .main-container {
            max-width: 1000px;
            margin: 3rem auto;
            padding: 0 2rem;
        }

        .section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            text-align: center;
            margin-bottom: 2.5rem;
            color: #e0e7ff;
            font-size: 2.2rem;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2.5rem;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 2.5rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .profile-avatar {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .profile-card h3 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .profile-card p {
            color: #e0e7ff;
            font-size: 1.1rem;
        }

        .profile-details {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.3rem;
            margin-bottom: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            border-left: 4px solid #a78bfa;
            transition: all 0.3s ease;
        }

        .detail-item:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }

        .detail-item:last-child {
            margin-bottom: 0;
        }

        .detail-label {
            font-weight: 600;
            color: #e0e7ff;
            font-size: 1rem;
        }

        .detail-value {
            font-size: 1rem;
            color: #fff;
            text-align: right;
        }

        .welcome-message {
            text-align: center;
            background: rgba(16, 185, 129, 0.2);
            border: 2px solid #10b981;
            padding: 1.2rem;
            border-radius: 10px;
            margin-bottom: 2.5rem;
            font-size: 1.1rem;
        }

        @media (max-width: 900px) {
            .profile-grid {
                grid-template-columns: 1fr;
            }

            .profile-avatar {
                width: 150px;
                height: 150px;
                font-size: 3rem;
            }
        }

        @media (max-width: 768px) {
            .nav-buttons {
                flex-wrap: wrap;
            }

            .section {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="window.location.reload()">Academix</div>
        <div class="nav-buttons">
            <a href="#" class="nav-btn active">Profile</a>
                
                <a href="mycourse.html" class="nav-btn"><span>My Courses</span></a>
                <a href="progress.html" class="nav-btn"><span>Progress</span></a>
                <a href="settings.html" class="nav-btn"><span>Settings</span></a>
                <a href="logout.html" class="nav-btn"><span>Logout</span></a>
               

            
        </div>
    </nav>

    <div class="main-container">
        <div class="section">
            <div class="welcome-message" id="welcomeMessage">
                Welcome back! We're glad to see you.
            </div>

            <h2>User Profile</h2>
            
            <div class="profile-grid">
                <div class="profile-card">
                    <div class="profile-avatar" id="avatar">JD</div>
                    <h3 id="displayName">John Doe</h3>
                    <p style="color: #e0e7ff; margin-top: 0.5rem;">Student</p>
                </div>

                <div class="profile-details">
                    <div class="detail-item">
                        <span class="detail-label">Full Name</span>
                        <span class="detail-value" id="userName">John Doe</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Email</span>
                        <span class="detail-value" id="userEmail">john@example.com</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Student ID</span>
                        <span class="detail-value" id="studentId">STU-2024-001</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Department</span>
                        <span class="detail-value" id="department">Computer Science</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Joined Date</span>
                        <span class="detail-value" id="joinDate">January 2024</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load user data from login
        function loadUserData() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            
            if (currentUser) {
                // Update profile information
                document.getElementById('userName').textContent = currentUser.name;
                document.getElementById('displayName').textContent = currentUser.name;
                document.getElementById('userEmail').textContent = currentUser.email;
                document.getElementById('studentId').textContent = currentUser.studentId;
                document.getElementById('department').textContent = currentUser.department;
                document.getElementById('joinDate').textContent = currentUser.joinDate;

                // Update avatar with initials
                const initials = currentUser.name
                    .split(' ')
                    .map(n => n[0])
                    .join('')
                    .toUpperCase();
                document.getElementById('avatar').textContent = initials;

                // Update welcome message
                document.getElementById('welcomeMessage').textContent = 
                    `Welcome back, ${currentUser.name.split(' ')[0]}! We're glad to see you.`;
            }
        }

        function navigateToCourses(e) {
            e.preventDefault();
            alert('Navigate to My Courses page (open courses.html)');
            // In real app: window.location.href = 'courses.html';
        }

        function navigateToProgress(e) {
            e.preventDefault();
            alert('Navigate to Progress page');
        }

        function navigateToSettings(e) {
            e.preventDefault();
            alert('Navigate to Settings page');
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm("Are you sure you want to logout?")) {
                localStorage.removeItem('currentUser');
                alert("Logged out successfully!");
                // In real app: window.location.href = 'login.html';
            }
        });

        // Load data on page load
        loadUserData();
    </script>

</body>
</html>
