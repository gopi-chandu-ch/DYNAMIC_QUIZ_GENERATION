<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Logged Out</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .logout-card {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 380px;
            width: 90%;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #2c3e50;
        }

        p {
            color: #7f8c8d;
            margin-bottom: 25px;
            font-size: 16px;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        }

        .btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
        }

        .footer {
            margin-top: 20px;
            font-size: 14px;
            color: #bdc3c7;
        }
    </style>
</head>
<body>
    <div class="logout-card">
        <div class="icon">Logout</div>
        <h1>Successfully Logged Out</h1>
        <p>Thank you for using our service. See you next time!</p>
        <a href="index.html" class="btn">Back to Home</a>
        <div class="footer">Redirecting in <span id="countdown">3</span> seconds...</div>
    </div>

    <script>
        // Clear localStorage/sessionStorage (client-side cleanup)
        localStorage.clear();
        sessionStorage.clear();

        // Auto-redirect countdown
        let timeLeft = 3;
        const countdownEl = document.getElementById('countdown');
        const redirectUrl = 'index.html'; // Change to your homepage

        const timer = setInterval(() => {
            timeLeft--;
            countdownEl.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timer);
                window.location.href = redirectUrl;
            }
        }, 1000);

        // Optional: Allow instant redirect on click
        document.querySelector('.btn').addEventListener('click', (e) => {
            clearInterval(timer);
        });
    </script>
</body>
</html>
