<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Courses - Academix</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0ea5e9 0%, #10b981 100%);
            color: #fff;
            min-height: 100vh;
        }

        nav {
            background: rgba(255, 255, 255, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .nav-btn.active {
            background: #0891b2;
            border-color: #0891b2;
        }

        #logoutBtn {
            background: #ff6b6b;
            border: none;
        }

        .main-container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .header-section h2 {
            font-size: 2rem;
            color: #e0e7ff;
        }

        #addCourseBtn {
            background: #10b981;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        #addCourseBtn:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .course-card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .course-card:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .course-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .course-card h3 {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }

        .status-badge {
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .completed { background: #10b981; }
        .progress { background: #f59e0b; }
        .notstarted { background: #ef4444; }

        .course-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.8rem;
            margin-top: 1rem;
        }

        .stat-item {
            text-align: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.8rem;
            border-radius: 8px;
        }

        .stat-item strong {
            display: block;
            font-size: 1.5rem;
            color: #a78bfa;
        }

        .stat-item span {
            font-size: 0.85rem;
            color: #e0e7ff;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 2% auto;
            padding: 0;
            border-radius: 20px;
            width: 90%;
            max-width: 1200px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .modal-header {
            padding: 2rem;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 2rem;
            color: #fff;
        }

        .close {
            color: #fff;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close:hover {
            transform: scale(1.2);
        }

        .modal-body {
            padding: 2rem;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }

        .tab {
            padding: 1rem 2rem;
            cursor: pointer;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .tab:hover {
            color: #fff;
        }

        .tab.active {
            color: #fff;
            border-bottom-color: #fff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        /* Videos Section */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .video-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .video-thumbnail {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .video-info {
            padding: 1rem;
        }

        .video-info h4 {
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .video-info p {
            font-size: 0.9rem;
            color: #e0e7ff;
        }

        .video-duration {
            display: inline-block;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.3rem 0.6rem;
            border-radius: 5px;
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }

        /* Quiz Section */
        .quiz-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 2rem;
        }

        .quiz-question {
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            border-radius: 10px;
        }

        .quiz-question h4 {
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .quiz-options {
            display: grid;
            gap: 0.8rem;
        }

        .quiz-option {
            background: rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .quiz-option:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #fff;
        }

        .quiz-option.selected {
            background: #10b981;
            border-color: #10b981;
        }

        .quiz-submit {
            background: #10b981;
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            margin-top: 1rem;
            transition: all 0.3s ease;
        }

        .quiz-submit:hover {
            background: #059669;
        }

        /* Topics Progress */
        .topic-list {
            display: grid;
            gap: 1rem;
        }

        .topic-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 1.5rem;
        }

        .topic-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .topic-header h4 {
            font-size: 1.2rem;
        }

        .progress-bar-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            height: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #0ea5e9);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .add-item-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px dashed rgba(255, 255, 255, 0.4);
            padding: 1rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            margin-top: 1rem;
            transition: all 0.3s ease;
        }

        .add-item-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            .course-grid {
                grid-template-columns: 1fr;
            }
            
            .tabs {
                flex-wrap: wrap;
            }
            
            .tab {
                padding: 0.8rem 1rem;
                font-size: 0.9rem;
            }

            .nav-buttons {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Academix</div>
        <div class="nav-buttons">
            <a href="profile.html" class="nav-btn"><span>Profile</span></a>
            
            <a href="#" class="nav-btn active">My Courses</a>
            
            <a href="progress.html" class="nav-btn"><span>Progress</span></a>
            <a href="settings.html" class="nav-btn"><span>Settings</span></a>
            <a href="logout.html" class="nav-btn"><span>Logout</span></a>
        </div>
    </nav>

    <div class="main-container">
        <div class="header-section">
            <h2>My Courses</h2>
            <button id="addCourseBtn">+ Add New Course</button>
        </div>

        <div class="course-grid" id="courseGrid"></div>
    </div>

    <!-- Course Detail Modal -->
    <div id="courseModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalCourseTitle"></h2>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <div class="tabs">
                    <button class="tab active" data-tab="videos">Videos</button>
                    <button class="tab" data-tab="quizzes">Quizzes</button>
                    <button class="tab" data-tab="progress">Topic Progress</button>
                </div>

                <!-- Videos Tab -->
                <div id="videos" class="tab-content active">
                    <div class="video-grid" id="videoGrid"></div>
                </div>

                <!-- Quizzes Tab -->
                <div id="quizzes" class="tab-content">
                    <div class="quiz-container" id="quizContainer"></div>
                    <button class="add-item-btn" onclick="addQuiz()">+ Add Quiz</button>
                </div>

                <!-- Progress Tab -->
                <div id="progress" class="tab-content">
                    <div class="topic-list" id="topicList"></div>
                    <button class="add-item-btn" onclick="addTopic()">+ Add Topic</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let courses = [];
        let currentCourseIndex = -1;

        // Initialize with sample data
        function initializeSampleData() {
            courses = [
                {
                    name: "Machine Learning",
                    status: "Completed",
                    videos: [
                        { title: "Introduction to ML", duration: "15:30", completed: true },
                        { title: "Supervised Learning", duration: "22:15", completed: true },
                        { title: "Neural Networks", duration: "28:45", completed: true }
                    ],
                    quizzes: [
                        {
                            question: "What is Machine Learning?",
                            options: [
                                "A type of AI that learns from data",
                                "A programming language",
                                "A database system",
                                "A web framework"
                            ],
                            correctAnswer: 0
                        }
                    ],
                    topics: [
                        { name: "Introduction", progress: 100 },
                        { name: "Supervised Learning", progress: 100 },
                        { name: "Unsupervised Learning", progress: 100 }
                    ]
                },
                {
                    name: "Web Development",
                    status: "In Progress",
                    videos: [
                        { title: "HTML Basics", duration: "18:20", completed: true },
                        { title: "CSS Styling", duration: "25:10", completed: false },
                        { title: "JavaScript Fundamentals", duration: "32:00", completed: false }
                    ],
                    quizzes: [
                        {
                            question: "What does HTML stand for?",
                            options: [
                                "Hyper Text Markup Language",
                                "High Tech Modern Language",
                                "Home Tool Markup Language",
                                "Hyperlinks and Text Markup Language"
                            ],
                            correctAnswer: 0
                        }
                    ],
                    topics: [
                        { name: "HTML Fundamentals", progress: 80 },
                        { name: "CSS Basics", progress: 45 },
                        { name: "JavaScript", progress: 20 }
                    ]
                },
                {
                    name: "Data Science",
                    status: "Not Started",
                    videos: [],
                    quizzes: [],
                    topics: [
                        { name: "Introduction to Data Science", progress: 0 },
                        { name: "Data Analysis", progress: 0 },
                        { name: "Data Visualization", progress: 0 }
                    ]
                }
            ];
            renderCourses();
        }

        function renderCourses() {
            const grid = document.getElementById('courseGrid');
            grid.innerHTML = '';

            courses.forEach((course, index) => {
                const completedVideos = course.videos.filter(v => v.completed).length;
                const totalVideos = course.videos.length;
                const avgProgress = course.topics.length > 0 
                    ? Math.round(course.topics.reduce((sum, t) => sum + t.progress, 0) / course.topics.length)
                    : 0;

                let statusClass = "";
                if (course.status === "Completed") statusClass = "completed";
                else if (course.status === "In Progress") statusClass = "progress";
                else statusClass = "notstarted";

                const card = document.createElement('div');
                card.className = 'course-card';
                card.onclick = () => openCourseModal(index);
                card.innerHTML = `
                    <div class="course-header">
                        <h3>${course.name}</h3>
                        <span class="status-badge ${statusClass}">${course.status}</span>
                    </div>
                    <div class="course-stats">
                        <div class="stat-item">
                            <strong>${totalVideos}</strong>
                            <span>Videos</span>
                        </div>
                        <div class="stat-item">
                            <strong>${course.quizzes.length}</strong>
                            <span>Quizzes</span>
                        </div>
                        <div class="stat-item">
                            <strong>${avgProgress}%</strong>
                            <span>Progress</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openCourseModal(index) {
            currentCourseIndex = index;
            const course = courses[index];
            document.getElementById('modalCourseTitle').textContent = course.name;
            document.getElementById('courseModal').style.display = 'block';
            
            renderVideos();
            renderQuizzes();
            renderTopics();
        }

        function renderVideos() {
            const course = courses[currentCourseIndex];
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';

            if (course.videos.length === 0) {
                grid.innerHTML = '<p style="text-align: center; padding: 2rem; color: #e0e7ff;">No videos available for this course yet.</p>';
                return;
            }

            course.videos.forEach((video, index) => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <div class="video-thumbnail">▶</div>
                    <div class="video-info">
                        <h4>${video.title}</h4>
                        <p>${video.completed ? '✓ Completed' : 'Not watched'}</p>
                        <span class="video-duration">${video.duration}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderQuizzes() {
            const course = courses[currentCourseIndex];
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';

            course.quizzes.forEach((quiz, quizIndex) => {
                const quizDiv = document.createElement('div');
                quizDiv.className = 'quiz-question';
                quizDiv.innerHTML = `
                    <h4>Question ${quizIndex + 1}: ${quiz.question}</h4>
                    <div class="quiz-options">
                        ${quiz.options.map((option, optIndex) => `
                            <div class="quiz-option" onclick="selectOption(${quizIndex}, ${optIndex})">
                                ${option}
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(quizDiv);
            });

            if (course.quizzes.length > 0) {
                const submitBtn = document.createElement('button');
                submitBtn.className = 'quiz-submit';
                submitBtn.textContent = 'Submit Quiz';
                submitBtn.onclick = submitQuiz;
                container.appendChild(submitBtn);
            } else {
                container.innerHTML = '<p style="text-align: center; padding: 2rem; color: #e0e7ff;">No quizzes available for this course yet.</p>';
            }
        }

        function selectOption(quizIndex, optionIndex) {
            const options = document.querySelectorAll('.quiz-question')[quizIndex].querySelectorAll('.quiz-option');
            options.forEach((opt, i) => {
                opt.classList.toggle('selected', i === optionIndex);
            });
        }

        function submitQuiz() {
            alert('Quiz submitted! Results will be displayed here.');
        }

        function renderTopics() {
            const course = courses[currentCourseIndex];
            const list = document.getElementById('topicList');
            list.innerHTML = '';

            course.topics.forEach(topic => {
                const topicDiv = document.createElement('div');
                topicDiv.className = 'topic-item';
                topicDiv.innerHTML = `
                    <div class="topic-header">
                        <h4>${topic.name}</h4>
                        <span>${topic.progress}%</span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: ${topic.progress}%">
                            ${topic.progress}%
                        </div>
                    </div>
                `;
                list.appendChild(topicDiv);
            });
        }

        function addQuiz() {
            const question = prompt("Enter quiz question:");
            if (!question) return;
            const options = [];
            for (let i = 0; i < 4; i++) {
                const opt = prompt(`Enter option ${i + 1}:`);
                if (!opt) return;
                options.push(opt);
            }
            const correct = parseInt(prompt("Enter correct option number (1-4):")) - 1;

            courses[currentCourseIndex].quizzes.push({
                question: question,
                options: options,
                correctAnswer: correct
            });
            renderQuizzes();
            renderCourses();
        }

        function addTopic() {
            const name = prompt("Enter topic name:");
            if (!name) return;
            const progress = parseInt(prompt("Enter progress percentage (0-100):")) || 0;

            courses[currentCourseIndex].topics.push({
                name: name,
                progress: Math.min(Math.max(progress, 0), 100)
            });
            renderTopics();
            renderCourses();
        }

        document.getElementById('addCourseBtn').addEventListener('click', () => {
            const name = prompt("Enter course name:");
            if (!name) return;
            const status = prompt("Enter status (Completed / In Progress / Not Started):");
            if (!status) return;

            courses.push({
                name: name,
                status: status,
                videos: [],
                quizzes: [],
                topics: []
            });
            renderCourses();
        });

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const targetTab = tab.getAttribute('data-tab');
                
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
                document.getElementById(targetTab).classList.add('active');
            });
        });

        // Close modal
        document.querySelector('.close').addEventListener('click', () => {
            document.getElementById('courseModal').style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            const modal = document.getElementById('courseModal');
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });

        function navigateToProfile(e) {
            e.preventDefault();
            alert('Navigate to Profile page');
        }

        function navigateToProgress(e) {
            e.preventDefault();
            alert('Navigate to Progress page');
        }

        function navigateToSettings(e) {
            e.preventDefault();
            alert('Navigate to Settings page');
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm("Are you sure you want to logout?")) {
                alert("Logged out successfully!");
            }
        });

        initializeSampleData();
    </script>

</body>
</html>
